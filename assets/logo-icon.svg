<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background Glow -->
    <filter id="mint-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Top Face: Vibrant Electric Mint Gradient -->
    <linearGradient id="top-face" x1="10" y1="18.7" x2="54" y2="18.7" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F5A0" />
      <stop offset="50%" stop-color="#00E5B8" />
      <stop offset="100%" stop-color="#00D2C4" />
    </linearGradient>

    <!-- Left Face: Royal Indigo Gradient -->
    <linearGradient id="left-face" x1="10" y1="18.7" x2="32" y2="56.8" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#665efd" />
      <stop offset="50%" stop-color="#533afd" />
      <stop offset="100%" stop-color="#2a2278" />
    </linearGradient>

    <!-- Right Face: Cyan to Indigo Transition -->
    <linearGradient id="right-face" x1="54" y1="18.7" x2="32" y2="56.8" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D2C4" />
      <stop offset="40%" stop-color="#3c46f8" />
      <stop offset="100%" stop-color="#4434d4" />
    </linearGradient>

    <!-- Inner Core: Glowing Data Mint Core -->
    <linearGradient id="core-glow" x1="32" y1="18" x2="32" y2="45" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#00F5A0" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#533afd" stop-opacity="0" />
    </linearGradient>

    <!-- Facet Highlight Linear Gradients -->
    <linearGradient id="facet-light" x1="32" y1="6" x2="32" y2="31.4" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#00F5A0" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Base Isometric Cube -->
  <!-- Left Face -->
  <path d="M10 18.7 L32 31.4 L32 56.8 L10 44.1 Z" fill="url(#left-face)" />

  <!-- Right Face -->
  <path d="M32 31.4 L54 18.7 L54 44.1 L32 56.8 Z" fill="url(#right-face)" />

  <!-- Top Face -->
  <path d="M32 6 L54 18.7 L32 31.4 L10 18.7 Z" fill="url(#top-face)" />

  <!-- Geometric Data-Mint Inner Architecture -->
  <!-- Top Inner Cut (Isometric Recessed Prism) -->
  <path d="M32 12 L46 20 L32 28 L18 20 Z" fill="#0d253d" fill-opacity="0.22" />
  <path d="M32 14 L42 20 L32 26 L22 20 Z" fill="url(#top-face)" fill-opacity="0.9" />

  <!-- Left Architectural Facet Slit -->
  <path d="M16 26 L26 31.8 L26 47 L16 41 Z" fill="#1c1e54" fill-opacity="0.35" />
  <path d="M18 28.5 L24 32 L24 44.5 L18 40.5 Z" fill="#665efd" fill-opacity="0.6" />

  <!-- Right Architectural Facet Slit -->
  <path d="M38 31.8 L48 26 L48 41 L38 47 Z" fill="#0d253d" fill-opacity="0.25" />
  <path d="M40 32 L46 28.5 L46 40.5 L40 44.5 Z" fill="#00E5B8" fill-opacity="0.5" />

  <!-- Center Vertex Light Core & Seams -->
  <line x1="32" y1="6" x2="32" y2="31.4" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.75" />
  <line x1="10" y1="18.7" x2="32" y2="31.4" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.4" />
  <line x1="54" y1="18.7" x2="32" y2="31.4" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.4" />
  <line x1="32" y1="31.4" x2="32" y2="56.8" stroke="#00F5A0" stroke-width="1.4" stroke-linecap="round" opacity="0.6" />

  <!-- Central Crystalline Node (Data Spark) -->
  <circle cx="32" cy="31.4" r="2.5" fill="#ffffff" filter="url(#mint-glow)" />
</svg>

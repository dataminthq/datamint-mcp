<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 48" width="210" height="48" fill="none">
  <defs>
    <!-- Background Glow -->
    <filter id="h-mint-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Top Face: Vibrant Electric Mint Gradient -->
    <linearGradient id="h-top-face" x1="8" y1="14" x2="38" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F5A0" />
      <stop offset="50%" stop-color="#00E5B8" />
      <stop offset="100%" stop-color="#00D2C4" />
    </linearGradient>

    <!-- Left Face: Royal Indigo Gradient -->
    <linearGradient id="h-left-face" x1="8" y1="14" x2="23" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#665efd" />
      <stop offset="50%" stop-color="#533afd" />
      <stop offset="100%" stop-color="#2a2278" />
    </linearGradient>

    <!-- Right Face: Cyan to Indigo Transition -->
    <linearGradient id="h-right-face" x1="38" y1="14" x2="23" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D2C4" />
      <stop offset="40%" stop-color="#3c46f8" />
      <stop offset="100%" stop-color="#4434d4" />
    </linearGradient>
  </defs>

  <!-- ICON (40x40 scale placed at offset x=2, y=3) -->
  <g transform="translate(0, 1)">
    <!-- Left Face -->
    <path d="M8 14.5 L23 23 L23 40 L8 31.5 Z" fill="url(#h-left-face)" />

    <!-- Right Face -->
    <path d="M23 23 L38 14.5 L38 31.5 L23 40 Z" fill="url(#h-right-face)" />

    <!-- Top Face -->
    <path d="M23 6 L38 14.5 L23 23 L8 14.5 Z" fill="url(#h-top-face)" />

    <!-- Inner Architectural Cuts -->
    <path d="M23 10 L32 15 L23 20.5 L14 15 Z" fill="#0d253d" fill-opacity="0.2" />
    <path d="M23 11.5 L29 15 L23 19 L17 15 Z" fill="url(#h-top-face)" fill-opacity="0.95" />

    <path d="M12 19 L19 23 L19 33 L12 29 Z" fill="#1c1e54" fill-opacity="0.3" />
    <path d="M27 23 L34 19 L34 29 L27 33 Z" fill="#0d253d" fill-opacity="0.25" />

    <!-- Center Highlights -->
    <line x1="23" y1="6" x2="23" y2="23" stroke="#ffffff" stroke-width="0.8" opacity="0.75" />
    <line x1="8" y1="14.5" x2="23" y2="23" stroke="#ffffff" stroke-width="0.7" opacity="0.4" />
    <line x1="38" y1="14.5" x2="23" y2="23" stroke="#ffffff" stroke-width="0.7" opacity="0.4" />
    <line x1="23" y1="23" x2="23" y2="40" stroke="#00F5A0" stroke-width="1" opacity="0.6" />

    <!-- Central Spark -->
    <circle cx="23" cy="23" r="1.8" fill="#ffffff" filter="url(#h-mint-glow)" />
  </g>

  <!-- WORDMARK: datamint -->
  <text
    x="48"
    y="31"
    fill="#0d253d"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif"
    font-size="25"
    font-weight="600"
    letter-spacing="-0.04em"
  >datamint</text>
</svg>
